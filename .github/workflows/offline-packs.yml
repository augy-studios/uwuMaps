# Builds uwuMaps' offline packs, one per region named in main-site/js/pack-list.js. Each is four files:
#
#   base       The basemap: Planetiler's OpenMapTiles profile, from OpenStreetMap, which OpenFreeMap's
#              styles draw as they are.
#   buildings  Coloured 3D buildings, cut out of Overture Maps' archive and slimmed down.
#   route      The offline router's road graph, for walking, cycling and driving.
#   search     Places and streets, for searching offline.
#
# Each goes on the `offline-packs` release as <id>-<build>.<archive>.000, .001 and so on (1 GiB each:
# GitHub takes at most 2 GB a file), with <id>.json naming them. /api/mappack reads that and hands the
# pieces out. A build's files carry its number, and the one before stays up, so a phone halfway through
# a download never gets a mix of two builds.
#
# Runs on the 2nd of each month, a day after the Geofabrik extracts have settled, and from the Actions
# tab (Run workflow). Give it `only` to build some regions: "singapore japan".

name: Offline packs

on:
  schedule:
    - cron: "41 3 2 * *"
  workflow_dispatch:
    inputs:
      only:
        description: Regions to build, by id, separated by spaces. Empty builds them all.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: offline-packs
  cancel-in-progress: false

env:
  PLANETILER_VERSION: "0.9.3"
  TAG: offline-packs

jobs:
  # Which regions, the release, and what every region needs, fetched once into the cache for the builds.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Regions
        id: matrix
        env:
          ONLY: ${{ inputs.only }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { PACKS } from "./main-site/js/pack-list.js";
            const only = (process.env.ONLY || "").split(/\s+/).filter(Boolean);
            const unknown = only.filter((id) => !PACKS.some((p) => p.id === id));
            if (unknown.length) throw new Error(`Unknown regions: ${unknown.join(", ")}`);
            const include = PACKS.filter((p) => !only.length || only.includes(p.id)).map((p) => ({ id: p.id, bounds: p.bounds.join(","), sources: p.sources.join("\n") }));
            appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          '

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Offline packs" \
            --notes "The offline maps uwuMaps keeps, rebuilt monthly by .github/workflows/offline-packs.yml. Map data © OpenStreetMap contributors (ODbL). Buildings © Overture Maps Foundation, OpenStreetMap contributors and others (ODbL)." \
            --prerelease --latest=false

      # The ocean polygons, made by osmdata.openstreetmap.de, which can be slow or down. Then, in turn:
      # a daily build of the same file checked against its manifest, a copy of osmdata's, and FAU
      # Erlangen's dated snapshots. Kept between runs too, since the coastline barely changes.
      - name: Ocean polygons from the last run
        uses: actions/cache/restore@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}
          restore-keys: water-polygons-

      - name: Ocean polygons
        run: |
          mkdir -p data/sources
          f=data/sources/water-polygons-split-3857.zip
          got=
          fetch() { # url [sha256]
            echo "Trying $1"
            curl -fL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1200 -o "$f.new" "$1" \
              && unzip -tq "$f.new" \
              && { [ -z "$2" ] || echo "$2  $f.new" | sha256sum -c -; } \
              && mv "$f.new" "$f" && got=$1
            rm -f "$f.new"
            [ -n "$got" ]
          }
          fau=https://ftp.fau.de/mirrors/openstreetmapdata.com-archive
          fetch https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip \
            || { sum=$(curl -fsS --max-time 30 https://osmdata.mapki.com/manifest.json \
                   | jq -r '.files["water-polygons-split-3857.zip"] | select(.placeholder | not) | .sha256 // empty') \
                 && [ -n "$sum" ] && fetch https://osmdata.mapki.com/download/water-polygons-split-3857.zip "$sum"; } \
            || fetch https://www.osmdata.org/download/water-polygons-split-3857.zip \
            || for d in $(curl -fsS --max-time 30 "$fau/" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}/' | sort -ru | head -4); do
                 curl -fsI --max-time 30 "$fau/${d}water-polygons-split-3857.zip" >/dev/null \
                   && fetch "$fau/${d}water-polygons-split-3857.zip" && break
               done
          if [ -n "$got" ]; then
            echo "Ocean polygons from $got"
          elif [ -s "$f" ]; then
            echo "::warning::No source answered; using the copy from an earlier run"
          else
            echo "::error::No ocean polygons: no source answered and there is no earlier copy"
            exit 1
          fi
          ls -la "$f"

      - name: Keep the ocean polygons
        uses: actions/cache/save@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}

      - name: Natural Earth and lake centre lines from the last run
        id: aux
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1

      - name: Natural Earth and lake centre lines
        if: steps.aux.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/sources
          get() { curl -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1200 -o "$1" "$2" && unzip -tq "$1"; }
          get data/sources/natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          get data/sources/lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip

      - name: Keep Natural Earth and lake centre lines
        if: steps.aux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # Gentle on Geofabrik, which asks for few downloads at a time.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ID: ${{ matrix.id }}
      BOUNDS: ${{ matrix.bounds }}
      SOURCES: ${{ matrix.sources }}
    steps:
      # The runner's preinstalled toolchains, which the bigger extracts need the room of.
      - name: Room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pack tools
        working-directory: tools
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler
        run: curl -fsSL --retry 3 -o planetiler.jar "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"

      - name: Ocean polygons
        uses: actions/cache/restore@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}
          restore-keys: water-polygons-
          fail-on-cache-miss: true

      - name: Natural Earth and lake centre lines
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1
          fail-on-cache-miss: true

      # This month's OpenStreetMap for the region: each way in SOURCES in turn, every file checked
      # against its MD5. Several files on a line are merged with osmium, one version of each object.
      - name: OpenStreetMap extract
        run: |
          set -o pipefail
          mkdir -p data/sources
          out=data/sources/$ID.osm.pbf
          get() { # file url: the file and its .md5, and the two must agree
            echo "Trying $2"
            curl -fL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 3600 -o "$1" "$2" \
              && sum=$(curl -fsSL --retry 3 --retry-all-errors --max-time 60 "$2.md5" | cut -d' ' -f1) \
              && [ -n "$sum" ] && echo "$sum  $1" | md5sum -c -
          }
          ok=
          while read -r line; do
            [ -z "$line" ] && continue
            set -- $line
            if [ $# -eq 1 ]; then
              get "$out" "$1" && ok=$1 && break
            else
              n=0; all=1
              for url in "$@"; do n=$((n + 1)); get "data/sources/part-$n.osm.pbf" "$url" || { all=; break; }; done
              if [ -n "$all" ]; then
                command -v osmium >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null; }
                # Where they overlap at the borders, an object can come in two versions; time-filter
                # keeps the one in force now.
                osmium merge data/sources/part-*.osm.pbf -o data/sources/merged.osm.pbf --overwrite \
                  && osmium time-filter data/sources/merged.osm.pbf -o "$out" --overwrite && ok=$line
                rm -f data/sources/part-*.osm.pbf data/sources/merged.osm.pbf
                [ -n "$ok" ] && break
              fi
            fi
            echo "::warning::$ID: didn't get it from $line"
            rm -f "$out" data/sources/part-*.osm.pbf
          done <<< "$SOURCES"
          [ -n "$ok" ] || { echo "::error::$ID: no source answered"; exit 1; }
          echo "From $ok"
          ls -la "$out"

      # Before Planetiler, which removes nothing, because the graph compiler needs the most memory.
      - name: Routing and search
        run: |
          node --max-old-space-size=12000 tools/packs/compile-graph.mjs "data/sources/$ID.osm.pbf" \
            --bounds="$BOUNDS" --route="$ID.route" --search="$ID.search"

      # Everything is here, so --download fetches nothing. Node locations go in a memory-mapped file,
      # which keeps a big country within the runner's 16 GB. Planetiler takes the format from the
      # output's extension, so it writes .pmtiles and the file's renamed after.
      - name: Basemap
        run: |
          java -Xmx8g -jar planetiler.jar \
            --download \
            --osm-path="data/sources/$ID.osm.pbf" \
            --bounds="$BOUNDS" \
            --maxzoom=14 \
            --storage=mmap \
            --output="$ID.pmtiles" \
            --force
          mv "$ID.pmtiles" "$ID.base"
          rm -f "data/sources/$ID.osm.pbf"
          head -c 7 "$ID.base" | grep -q PMTiles
          ls -la "$ID.base"

      - name: Buildings
        run: node tools/packs/extract-buildings.mjs --bounds="$BOUNDS" --out="$ID.buildings"

      # Each archive in 1 GiB pieces (a multiple of /api/mappack's 4 MiB, so none of its pieces spans two
      # files), then the manifest naming them, then the builds before the last two taken down.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ github.run_id }}
        run: |
          set -eo pipefail
          archives='{}'
          for a in base buildings route search; do
            base="$ID-$BUILD.$a"
            split -b 1073741824 -d -a 3 "$ID.$a" "$base."
            files=$(for f in "$base".*; do jq -n --arg name "$f" --argjson size "$(stat -c %s "$f")" '{name: $name, size: $size}'; done | jq -s .)
            archives=$(jq -n --argjson all "$archives" --arg a "$a" --argjson size "$(stat -c %s "$ID.$a")" --argjson files "$files" '$all + {($a): {size: $size, files: $files}}')
            gh release upload "$TAG" "$base".* --clobber
            rm -f "$ID.$a"
          done
          jq -n --arg id "$ID" --arg build "$BUILD" --argjson archives "$archives" \
            '{id: $id, build: $build, built: (now | todate), archives: $archives}' > "$ID.json"
          cat "$ID.json"
          gh release upload "$TAG" "$ID.json" --clobber
          gh release view "$TAG" --json assets -q '.assets[].name' > assets.txt
          old=$(grep -oE "^$ID-[0-9]+\." assets.txt | sed -E "s/^$ID-([0-9]+)\..*/\1/" | sort -un | head -n -2 || true)
          for n in $old; do
            grep -F "$ID-$n." assets.txt | while read -r a; do gh release delete-asset "$TAG" "$a" -y; done
          done
